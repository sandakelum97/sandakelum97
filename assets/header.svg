<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-label="Tharaka Dissanayaka — Security Engineer, AI Security, Builder">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#00ff41" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ff41" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00ff41" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#00ff41" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff41"/>
      <stop offset="1" stop-color="#00d4ff"/>
    </linearGradient>
    <clipPath id="win"><rect x="10" y="10" width="880" height="250" rx="12"/></clipPath>
    <style>
      text { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
      .dim { fill: #5c6370; font-size: 14px; }
      .p   { fill: #00ff41; font-size: 15px; }
      .o   { fill: #c9d1d9; font-size: 15px; }
      .k   { fill: #00d4ff; }
      .w   { fill: #ffbd2e; }
      .l1, .l2, .l3, .l4, .l5 { opacity: 0; animation: in 0.4s ease forwards; }
      .l1 { animation-delay: 0.2s; } .l2 { animation-delay: 0.9s; }
      .l3 { animation-delay: 1.6s; } .l4 { animation-delay: 2.3s; }
      .l5 { animation-delay: 3.0s; }
      @keyframes in { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
      .cur { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .scan { animation: sweep 5s linear infinite; }
      @keyframes sweep { from { transform: translateY(-80px); } to { transform: translateY(270px); } }
    </style>
  </defs>

  <rect x="10" y="10" width="880" height="250" rx="12" fill="#0d1117" stroke="#00ff41" stroke-opacity="0.35"/>
  <g clip-path="url(#win)">
    <rect x="10" y="10" width="880" height="250" fill="url(#grid)"/>
    <rect class="scan" x="10" y="0" width="880" height="80" fill="url(#scan)"/>
  </g>

  <!-- title bar -->
  <path d="M10 22a12 12 0 0 1 12-12h856a12 12 0 0 1 12 12v18H10z" fill="#161b22"/>
  <circle cx="32" cy="25" r="6" fill="#ff5f56"/>
  <circle cx="52" cy="25" r="6" fill="#ffbd2e"/>
  <circle cx="72" cy="25" r="6" fill="#27c93f"/>
  <text x="450" y="30" text-anchor="middle" class="dim">tharaka@soc: ~/profile</text>

  <!-- body -->
  <g class="l1">
    <text x="36" y="72" class="p">$ <tspan class="o">whoami</tspan></text>
  </g>
  <g class="l2">
    <text x="36" y="112" font-size="34" font-weight="700" fill="url(#name)">Tharaka Dissanayaka</text>
  </g>
  <g class="l3">
    <text x="36" y="146" class="p">$ <tspan class="o">cat role.txt</tspan></text>
  </g>
  <g class="l4">
    <text x="36" y="174" class="o"><tspan class="k">Security Engineer</tspan>  ·  <tspan class="w">AI Security</tspan>  ·  <tspan fill="#00ff41">Builder</tspan></text>
    <text x="36" y="198" class="dim">~50 managed tenants · detection · IR · vuln mgmt · SOC automation</text>
  </g>
  <g class="l5">
    <text x="36" y="236" class="p">$ <tspan class="o">./status --all</tspan>  <tspan fill="#27c93f">[ OK ]</tspan> <tspan class="dim">all systems secure</tspan><tspan class="cur" fill="#00ff41"> █</tspan></text>
  </g>

  <!-- shield mark -->
  <g transform="translate(770 78)" opacity="0.9">
    <path d="M50 0 L95 16 V52 C95 84 74 108 50 118 C26 108 5 84 5 52 V16 Z" fill="none" stroke="#00ff41" stroke-width="2.5"/>
    <path d="M50 14 L82 26 V53 C82 77 67 95 50 103 C33 95 18 77 18 53 V26 Z" fill="#00ff41" fill-opacity="0.08"/>
    <text x="50" y="70" text-anchor="middle" font-size="22" font-weight="700" fill="#00ff41">&lt;/&gt;</text>
  </g>
</svg>
