# Save as .github/workflows/profile-readme.yml in the sandakelum97/sandakelum97 repo.
# Job 1 pulls your latest Medium posts into the README between the BLOG-POST-LIST markers.
# Job 2 generates the contribution snake SVG on the "output" branch that the README embeds.

name: Update profile README

on:
  schedule:
    - cron: "0 0 * * *"      # daily at 00:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  blog-posts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://medium.com/feed/@sandakelum.97"
          max_post_count: 5
          template: "- [$title]($url) — $date $newline"
          date_format: "dd mmm yyyy"
          commit_message: "chore: update latest articles"

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: sandakelum97
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
