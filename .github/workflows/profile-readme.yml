# Keeps the profile README's self-generated parts fresh.
# Jobs run one after another (needs:) so they never race each other pushing to main.
#   blog-posts → latest Medium articles between the BLOG-POST-LIST markers
#   summary    → profile summary cards in profile-summary-card-output/chartreuse_dark/
#   contrib-3d → 3D contribution calendar in profile-3d-contrib/
#   snake      → contribution snake on the "output" branch
#
# Optional: add a classic PAT (scopes: read:user, repo) as the repo secret SUMMARY_GITHUB_TOKEN
# so the summary cards and 3D calendar can include private-repo activity. Without it they fall
# back to GITHUB_TOKEN and show public activity only.

name: Update profile README

on:
  schedule:
    - cron: "0 0 * * *"      # daily at 00:00 UTC (05:30 Colombo)
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "profile-summary-card-output/**"
      - "profile-3d-contrib/**"

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: false

jobs:
  blog-posts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://medium.com/feed/@sandakelum.97"
          max_post_count: 5
          template: "$newline- [$title]($url) — $date"
          date_format: "dd mmm yyyy"
          commit_message: "chore: update latest articles"

  summary:
    needs: blog-posts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          TIME_ZONE: "Asia/Colombo"
          THEME: "chartreuse_dark"
          ANIMATION: "rise"
          AUTO_PUSH: true

  contrib-3d:
    needs: summary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-contrib
          if git commit -m "chore: update 3D contribution calendar"; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: sandakelum97
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00ff41&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
